<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planejamento Mini Mensa - 2º Semestre 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone@7.23.6/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        body { 
            font-family: 'Inter', sans-serif; 
            margin: 0;
            padding: 0;
            background-color: #f8faf8;
        }
        #root { min-height: 100vh; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-presets="react">
        const { useState, useEffect } = React;

        const Icon = ({ name, size = 24, className = "" }) => {
            useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            }, [name]);
            return <i data-lucide={name} style={{ width: size, height: size }} className={className}></i>;
        };

        // Adicione as novas aulas copiando um bloco existente e mudando os dados
        const scheduleData = [
            { 
                id: 1, 
                date: "01/08", 
                title: "Aula Inaugural do 2º Semestre", 
                description: "Abertura do semestre e boas-vindas aos Jovens Brilhantes. Apresentação das novas propostas para o ciclo.", 
                icon: "star" 
            },
            { 
                id: 2, 
                date: "Setembro", 
                title: "Agzinho 2026", 
                description: "Nosso grande encontro com atividades especiais e muita integração presencial para os JBs.", 
                icon: "users" 
            },
            { 
                id: 3, 
                date: "A Definir", 
                title: "Espaço para Nova Aula", 
                description: "Para adicionar novas aulas, basta copiar este bloco no código, alterar o ID para o próximo número, e preencher a data, o título e a descrição.", 
                icon: "brain" 
            }
        ];

        const EventCard = ({ event, isLeft }) => {
            const [isExpanded, setIsExpanded] = useState(false);
            
            return (
                <div className={`mb-8 flex justify-between items-center w-full ${isLeft ? 'flex-row-reverse' : ''}`}>
                    <div className="hidden md:block w-5/12"></div>
                    <div className="z-20 relative">
                        <div className="flex items-center justify-center w-10 h-10 rounded-full bg-green-700 text-white shadow-lg border-2 border-white">
                            <Icon name={event.icon} size={18} />
                        </div>
                    </div>
                    <div className="w-full md:w-5/12 pl-6 md:pl-0">
                        <div 
                            className="bg-white p-5 rounded-xl shadow-sm border border-gray-100 hover:border-green-200 transition-all cursor-pointer group"
                            onClick={() => setIsExpanded(!isExpanded)}
                        >
                            <div className="flex justify-between items-center mb-1">
                                <span className="text-[10px] font-bold tracking-widest text-green-700 uppercase bg-green-50 px-2 py-0.5 rounded">
                                    {event.date}
                                </span>
                                <div className="text-gray-300 group-hover:text-green-500">
                                    <Icon name={isExpanded ? "chevron-up" : "chevron-down"} size={16} />
                                </div>
                            </div>
                            <h3 className="text-lg font-bold text-gray-800 leading-tight">
                                {event.title}
                            </h3>
                            <div className={`text-gray-600 text-sm leading-relaxed transition-all duration-300 overflow-hidden ${isExpanded ? 'max-h-[1200px] mt-3 opacity-100' : 'max-h-0 opacity-0'}`}>
                                {event.description.split('\n').map((line, i) => (
                                    <p key={i} className={line.trim() === "" ? "h-2" : "mb-2"}>{line}</p>
                                ))}
                                
                                {event.links && event.links.map((link, idx) => (
                                    <div key={idx} className="mt-2 p-3 bg-red-50 border border-red-100 rounded-lg flex items-center gap-2">
                                        <Icon name="file-text" size={16} className="text-red-600" />
                                        <a href={link.url} target="_blank" rel="noopener noreferrer" className="text-red-700 font-bold hover:underline" onClick={(e) => e.stopPropagation()}>
                                            {link.text}
                                        </a>
                                    </div>
                                ))}

                                {event.link && (
                                    <div className="mt-2 p-3 bg-red-50 border border-red-100 rounded-lg flex items-center gap-2">
                                        <Icon name="link" size={16} className="text-red-600" />
                                        <a href={event.link} target="_blank" rel="noopener noreferrer" className="text-red-700 font-bold hover:underline" onClick={(e) => e.stopPropagation()}>
                                            {event.linkText}
                                        </a>
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        function App() {
            const recordingsUrl = "https://onedrive.live.com/?cid=49a93f54e8dd4ede&id=49A93F54E8DD4EDE%21s3480cfbbc096403aa268467696aec41b&resid=49A93F54E8DD4EDE%21s3480cfbbc096403aa268467696aec41b&ithint=folder&e=pA3N51&migratedtospo=true&redeem=aHR0cHM6Ly8xZHJ2Lm1zL2YvYy80OWE5M2Y1NGU4ZGQ0ZWRlL0lnQzd6NEEwbHNBNlFLSm9SbmFXcnNRYkFXdE82ZzlYRzd5alR0VnFTRmppZjZZP2U9cEEzTjUx&v=validatepermission";

            return (
                <div className="min-h-screen bg-[#f8faf8] font-sans text-gray-900">
                    <div className="bg-[#003d26] text-white text-[10px] py-2 px-6 font-bold tracking-[0.2em] uppercase flex justify-between items-center">
                        <span>Mensa Brasil - High IQ Society</span>
                        <span className="opacity-70 uppercase tracking-widest">Inovação e Talento</span>
                    </div>

                    <nav className="bg-white border-b border-gray-200 px-6 py-4 flex justify-between items-center sticky top-0 z-50">
                        <div className="flex items-center gap-3">
                            <div className="bg-green-700 p-2 rounded-lg text-white">
                                <Icon name="globe" size={24} />
                            </div>
                            <div>
                                <h1 className="font-bold text-xl leading-none text-green-900 tracking-tighter uppercase">Mensa</h1>
                                <span className="text-[10px] font-bold text-gray-400 tracking-[0.3em] uppercase">Brasil</span>
                            </div>
                        </div>
                        <div className="flex gap-8 text-[11px] font-bold uppercase tracking-widest text-gray-600">
                            <span className="text-green-700 border-b-2 border-green-700 pb-1 cursor-pointer">2º Semestre</span>
                            <a href="index.html" className="hover:text-green-700 cursor-pointer hidden sm:block transition-colors">
                                1º Semestre
                            </a>
                            <a href={recordingsUrl} target="_blank" rel="noopener noreferrer" className="hover:text-green-700 cursor-pointer hidden md:block transition-colors">
                                Gravados
                            </a>
                        </div>
                        <div className="w-10"></div>
                    </nav>

                    <header className="relative bg-[#004a2f] py-20 px-6 overflow-hidden">
                        <div className="absolute top-0 right-0 w-1/3 h-full opacity-10 pointer-events-none text-white">
                            <Icon name="rocket" size={400} className="-mr-20 -mt-20" />
                        </div>
                        <div className="max-w-4xl mx-auto relative z-10">
                            <div className="mb-6 flex items-center gap-2">
                                <Icon name="shield-check" size={20} className="text-green-400" />
                                <span className="text-green-300 text-xs font-bold uppercase tracking-[0.2em]">Enriquecimento Cognitivo</span>
                            </div>
                            <h2 className="text-5xl md:text-7xl font-extrabold text-white mb-6 leading-[0.9] tracking-tighter">
                                Planejamento Semestral <br />
                                <span className="text-green-400">2º Semestre 2026</span>
                            </h2>
                            <p className="text-xl md:text-2xl text-green-50/80 font-medium max-w-2xl leading-relaxed">
                                Acompanhe a nossa agenda de aulas para os <span className="text-white font-bold underline decoration-green-400">Jovens Brilhantes</span>. O conteúdo é atualizado continuamente.
                            </p>
                        </div>
                    </header>

                    <main className="max-w-5xl mx-auto px-6 py-12">
                        <div className="max-w-4xl mx-auto mt-10">
                            <div className="flex items-center gap-4 mb-16">
                                <div className="h-px bg-gray-200 flex-1"></div>
                                <h2 className="text-2xl font-black text-gray-800 uppercase tracking-widest text-center">Calendário de Aulas</h2>
                                <div className="h-px bg-gray-200 flex-1"></div>
                            </div>
                            
                            <div className="relative">
                                <div className="absolute left-[20px] md:left-1/2 md:-ml-[1px] top-0 bottom-0 w-[2px] bg-green-100"></div>
                                <div className="relative z-10">
                                    {scheduleData.map((event, index) => (
                                        <EventCard key={event.id} event={event} isLeft={index % 2 === 0} />
                                    ))}
                                </div>
                            </div>
                        </div>

                        <section className="mt-20 bg-white border-2 border-green-100 rounded-3xl p-10 flex flex-col md:flex-row items-center gap-8 shadow-sm">
                            <div className="bg-green-700 p-6 rounded-2xl text-white shadow-lg">
                                <Icon name="target" size={48} />
                            </div>
                            <div className="flex-1">
                                <h3 className="text-2xl font-bold mb-3 text-green-900 uppercase tracking-tighter">Preparatórios e Olimpíadas</h3>
                                <div className="text-gray-600 text-lg leading-relaxed space-y-4">
                                    <p>
                                        As datas específicas dos encontros preparatórios para olimpíadas científicas como a <span className="font-bold text-green-700">OBAFOG</span> serão divulgadas nesta seção ao longo do semestre.
                                    </p>
                                    <div className="mt-4 pt-2">
                                        <a href="link_geral_aulas.html" className="inline-flex items-center gap-2 px-6 py-3 bg-green-700 text-white font-bold rounded-xl hover:bg-green-800 transition-colors shadow-md group">
                                            <Icon name="link" size={18} className="text-green-200" />
                                            Acessar Link das Aulas
                                            <Icon name="chevron-right" size={16} className="group-hover:translate-x-1 transition-transform" />
                                        </a>
                                    </div>
                                </div>
                            </div>
                        </section>
                    </main>

                    <footer className="bg-gray-100 border-t border-gray-200 py-12 px-6 mt-20">
                        <div className="max-w-5xl mx-auto flex flex-col md:flex-row justify-between items-center gap-6 text-[10px] font-black text-gray-400 tracking-widest uppercase text-center md:text-left">
                            <div className="flex items-center gap-2">
                                <div className="bg-green-700 p-1 rounded text-white">
                                    <Icon name="globe" size={14} />
                                </div>
                                <span className="text-green-900">Mensa Brasil</span>
                            </div>
                            <div className="flex flex-col items-center">
                                <p>© 2026 - PROGRAMA MINI MENSA</p>
                                <p className="mt-1 opacity-70">Gestão Ivana Rebello</p>
                            </div>
                            <div className="flex gap-4">
                                <span>Privacidade</span>
                                <span>Contato</span>
                            </div>
                        </div>
                    </footer>
                </div>
            );
        }

        window.addEventListener('load', () => {
            const container = document.getElementById('root');
            if (container) {
                const root = ReactDOM.createRoot(container);
                root.render(<App />);
            }
        });
    </script>
</body>
</html>
