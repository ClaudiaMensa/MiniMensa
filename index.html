<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planejamento Mini Mensa 2026</title>
    <!-- Tailwind CSS para estilização -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React e ReactDOM via CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel para traduzir JSX no navegador -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        body { 
            font-family: 'Inter', sans-serif; 
            margin: 0;
            padding: 0;
        }
        #root { min-height: 100vh; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Componente de ícone robusto para ambiente CDN
        const Icon = ({ name, size = 24, className = "" }) => {
            useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            }, [name]);
            return <i data-lucide={name} style={{ width: size, height: size }} className={className}></i>;
        };

        const scheduleData = [
            { id: 1, date: "14/03", title: "Aula Inaugural", description: "Abertura do semestre com Ivana Rebello e Claudia Aguiar. Horário especial: das 09:00 às 10:00.", icon: "star" },
            { id: 2, date: "21/03", title: "Robótica & Olimpíadas", description: "Manhã: Aula de Robótica com Prof. Rafael Traldi Moura (Poli USP).\n\nA tarde aulas preparatórias olimpíadas com Claudia Aguiar (OBA, MOBFOG, OBMEP ... conforme a necessidade).", icon: "bot" },
            { id: 3, date: "28/03", title: "Projeto Quasar", description: "Aulas preparadas durante o Projeto Quasar com Isabela Bicalho sobre a teoria do Espaço-Tempo e com o Astronauta Análogo Cadete Francesco Vittório.", icon: "rocket" },
            { id: 4, date: "04/04", title: "Oficina de Páscoa", description: "Oficina divertida especial temática.", icon: "palette" },
            { id: 5, date: "11/04", title: "Arte e Criatividade", description: "Aula de Arte e Criatividade.\n\nPensar Criar e transformar com ideias que ganham formas.\n\nCom Prof. Tales Ebner, artista multidisciplinar.", icon: "palette" },
            { id: 6, date: "18/04", title: "Robótica", description: "Oficina de robótica e programação com o Prof. Rafael Traldi Moura da Universidade de São Paulo - Escola Politécnica.", icon: "bot" },
            { id: 7, date: "25/04", title: "Física Experimental", description: "Aulas com princípios de física avançada com o professor Bruno da Universidade Federal do ABC.", icon: "test-tube" },
            { id: 8, date: "02/05", title: "Robótica", description: "Aprofundamento em projetos de engenharia e mecânica robótica.\n\nCom o Professor Rafael Traldi Moura da Poli USP", icon: "bot" },
            { id: 10, date: "09/05", title: "Biologia e Genética", description: "Exploração de conceitos modernos de genética e biologia molecular.", icon: "test-tube" },
            { id: 17, date: "16/05", title: "Planos e Camadas", description: "Planos e Camadas: construindo o mundo um passo de cada vez.\n\nCom Prof. Tales Ebner, artista multidisciplinar.", icon: "layers" },
            { id: 11, date: "23/05", title: "Robótica", description: "Aula de Robótica e Lógica com o Prof. Rafael Traldi Moura.", icon: "bot" },
            { id: 12, date: "30/05", title: "Química", description: "Sobre a tabela periódica, os elementos raros e algumas mágicas.", icon: "flask-conical" },
            { id: 13, date: "06/06", title: "Engenhocas e Mecânica", description: "Aula de engenhocas focada em desafios de física e mecânica aplicada com a Profa. Claudia Aguiar.", icon: "brain" },
            { id: 14, date: "13/06", title: "Robótica", description: "Oficina de robótica, finalização de projetos e testes práticos com o Prof. Rafael Traldi Moura.", icon: "bot" },
            { id: 15, date: "20/06", title: "Do traço ao personagem", description: "Dando vida ao papel com Prof. Tales Ebner, artista multidisciplinar.", icon: "palette" },
            { id: 16, date: "27/06", title: "Encerramento do Semestre", description: "Confraternização e revisão das conquistas do semestre.\n\nLançamento do programa Nasa Space Apps.", icon: "graduation-cap" }
        ];

        const EventCard = ({ event, isLeft }) => {
            const [isExpanded, setIsExpanded] = useState(false);
            
            return (
                <div className={`mb-8 flex justify-between items-center w-full ${isLeft ? 'flex-row-reverse' : ''}`}>
                    <div className="hidden md:block w-5/12"></div>
                    <div className="z-20 relative">
                        <div className="flex items-center justify-center w-10 h-10 rounded-full bg-green-700 text-white shadow-lg border-2 border-white">
                            <Icon name={event.icon} size={18} />
                        </div>
                    </div>
                    <div className="w-full md:w-5/12 pl-6 md:pl-0">
                        <div 
                            className="bg-white p-5 rounded-xl shadow-sm border border-gray-100 hover:border-green-200 transition-all cursor-pointer group"
                            onClick={() => setIsExpanded(!isExpanded)}
                        >
                            <div className="flex justify-between items-center mb-1">
                                <span className="text-[10px] font-bold tracking-widest text-green-700 uppercase bg-green-50 px-2 py-0.5 rounded">
                                    {event.date}
                                </span>
                                <div className="text-gray-300 group-hover:text-green-500">
                                    <Icon name={isExpanded ? "chevron-up" : "chevron-down"} size={16} />
                                </div>
                            </div>
                            <h3 className="text-lg font-bold text-gray-800 leading-tight">
                                {event.title}
                            </h3>
                            <div className={`text-gray-600 text-sm leading-relaxed transition-all duration-300 overflow-hidden ${isExpanded ? 'max-h-64 mt-3 opacity-100' : 'max-h-0 opacity-0'}`}>
                                {event.description.split('\n').map((line, i) => (
                                    <p key={i} className={line.trim() === "" ? "h-2" : "mb-1"}>{line}</p>
                                ))}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        function App() {
            return (
                <div className="min-h-screen bg-[#f8faf8] font-sans text-gray-900">
                    <div className="bg-[#003d26] text-white text-[10px] py-2 px-6 font-bold tracking-[0.2em] uppercase flex justify-between items-center">
                        <span>Mensa Brasil - High IQ Society</span>
                        <span className="opacity-70 uppercase tracking-widest">Inovação e Talento</span>
                    </div>

                    <nav className="bg-white border-b border-gray-200 px-6 py-4 flex justify-between items-center sticky top-0 z-50">
                        <div className="flex items-center gap-3">
                            <div className="bg-green-700 p-2 rounded-lg text-white">
                                <Icon name="globe" size={24} />
                            </div>
                            <div>
                                <h1 className="font-bold text-xl leading-none text-green-900 tracking-tighter uppercase">Mensa</h1>
                                <span className="text-[10px] font-bold text-gray-400 tracking-[0.3em] uppercase">Brasil</span>
                            </div>
                        </div>
                        <div className="flex gap-8 text-[11px] font-bold uppercase tracking-widest text-gray-600">
                            <span className="text-green-700 border-b-2 border-green-700 pb-1 cursor-pointer">Planejamento</span>
                            <span className="hover:text-green-700 cursor-pointer hidden sm:block">Programas</span>
                        </div>
                        <div className="w-10"></div>
                    </nav>

                    <header className="relative bg-[#004a2f] py-20 px-6 overflow-hidden">
                        <div className="absolute top-0 right-0 w-1/3 h-full opacity-10 pointer-events-none text-white">
                            <Icon name="brain" size={400} className="-mr-20 -mt-20" />
                        </div>
                        <div className="max-w-4xl mx-auto relative z-10">
                            <div className="mb-6 flex items-center gap-2">
                                <Icon name="shield-check" size={20} className="text-green-400" />
                                <span className="text-green-300 text-xs font-bold uppercase tracking-[0.2em]">Enriquecimento Cognitivo</span>
                            </div>
                            <h2 className="text-5xl md:text-7xl font-extrabold text-white mb-6 leading-[0.9] tracking-tighter">
                                Planejamento Semestral <br />
                                <span className="text-green-400">Mini Mensa 2026</span>
                            </h2>
                            <p className="text-xl md:text-2xl text-green-50/80 font-medium max-w-2xl leading-relaxed">
                                Desenvolvendo o potencial de <span className="text-white font-bold underline decoration-green-400">Jovens Brilhantes</span> através de atividades de alta performance cognitiva, de forma lúdica e divertida valorizando o trabalho em equipe e valores humanos.
                            </p>
                        </div>
                    </header>

                    <main className="max-w-5xl mx-auto px-6 py-12">
                        <section className="grid md:grid-cols-3 gap-6 -mt-24 relative z-20 mb-20">
                            <div className="bg-white p-8 rounded-2xl shadow-xl border-b-4 border-green-700">
                                <div className="bg-green-50 w-12 h-12 rounded-xl flex items-center justify-center mb-4 text-green-700">
                                    <Icon name="brain" size={24} />
                                </div>
                                <h3 className="font-bold text-lg mb-2 text-green-900 uppercase tracking-tighter">Objetivos</h3>
                                <p className="text-sm text-gray-500 leading-relaxed">Programa extracurricular focado no estímulo ao alto QI, atuando de forma complementar e diferenciada da grade escolar tradicional.</p>
                            </div>
                            <div className="bg-white p-8 rounded-2xl shadow-xl border-b-4 border-green-700">
                                <div className="bg-green-50 w-12 h-12 rounded-xl flex items-center justify-center mb-4 text-green-700">
                                    <Icon name="trophy" size={24} />
                                </div>
                                <h3 className="font-bold text-lg mb-2 text-green-900 uppercase tracking-tighter">Auxílio Preparatório</h3>
                                <p className="text-sm text-gray-500 leading-relaxed">Preparação dedicada para Olimpíadas Científicas como MOBFOG, programas NASA (IASC), OBMEP e outras.</p>
                            </div>
                            <div className="bg-white p-8 rounded-2xl shadow-xl border-b-4 border-green-700">
                                <div className="bg-green-50 w-12 h-12 rounded-xl flex items-center justify-center mb-4 text-green-700">
                                    <Icon name="sparkles" size={24} />
                                </div>
                                <h3 className="font-bold text-lg mb-2 text-green-900 uppercase tracking-tighter">Conhecimento Integrado</h3>
                                <p className="text-sm text-gray-500 leading-relaxed">
                                    Física, Biologia, Matemática, Química, Astronomia e Artes em aulas práticas integrando robótica e engenhosidade técnica. 
                                    <span className="block mt-2 font-semibold italic text-green-700 text-xs">A nossa ideia é trazer saberes diversos para agitar e desafiar estas mentes brilhantes.</span>
                                </p>
                            </div>
                        </section>

                        <div className="max-w-4xl mx-auto">
                            <div className="flex items-center gap-4 mb-16">
                                <div className="h-px bg-gray-200 flex-1"></div>
                                <a href="./links.html">
                                <h2 className="text-2xl font-black text-gray-800 uppercase tracking-widest text-center">Links para entrar nas aulas</h2>
                                </a>
                                <div className="h-px bg-gray-200 flex-1"></div>
                                <div className="h-px bg-gray-200 flex-1"></div>
                                <h2 className="text-2xl font-black text-gray-800 uppercase tracking-widest text-center">Calendário de Aulas</h2>
                                <div className="h-px bg-gray-200 flex-1"></div>
                            </div>
                            <div className="relative">
                                <div className="absolute left-[20px] md:left-1/2 md:-ml-[1px] top-0 bottom-0 w-[2px] bg-green-100"></div>
                                <div className="relative z-10">
                                    {scheduleData.map((event, index) => (
                                        <EventCard key={event.id} event={event} isLeft={index % 2 === 0} />
                                    ))}
                                </div>
                            </div>
                        </div>

                        <section className="mt-20 bg-white border-2 border-green-100 rounded-3xl p-10 flex flex-col md:flex-row items-center gap-8 shadow-sm">
                            <div className="bg-green-700 p-6 rounded-2xl text-white shadow-lg">
                                <Icon name="clock" size={48} />
                            </div>
                            <div className="flex-1">
                                <h3 className="text-2xl font-bold mb-3 text-green-900 uppercase tracking-tighter">Horários de Preparatórios</h3>
                                <p className="text-gray-600 text-lg leading-relaxed">
                                    Nos dias de aula, os preparatórios ocorrem das <span className="font-bold text-green-700 bg-green-50 px-2 py-1 rounded">10:30 às 12:00 (Manhã)</span> e <span className="font-bold text-green-700 bg-green-50 px-2 py-1 rounded">no período da tarde aos sábados</span>.
                                </p>
                            </div>
                        </section>
                    </main>

                    <footer className="bg-gray-100 border-t border-gray-200 py-12 px-6 mt-20">
                        <div className="max-w-5xl mx-auto flex flex-col md:flex-row justify-between items-center gap-6 text-[10px] font-black text-gray-400 tracking-widest uppercase">
                            <div className="flex items-center gap-2">
                                <div className="bg-green-700 p-1 rounded text-white">
                                    <Icon name="globe" size={14} />
                                </div>
                                <span className="text-green-900">Mensa Brasil</span>
                            </div>
                            <p>© 2026 - PROGRAMA MINI MENSA</p>
                            <div className="flex gap-4">
                                <span>Privacidade</span>
                                <span>Contato</span>
                            </div>
                        </div>
                    </footer>
                </div>
            );
        }

        // Garante que o DOM esteja carregado antes de renderizar
        window.addEventListener('load', () => {
            const container = document.getElementById('root');
            if (container) {
                const root = ReactDOM.createRoot(container);
                root.render(<App />);
            }
        });
    </script>
</body>
</html>
